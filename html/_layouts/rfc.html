<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/rfc.css' | relative_url }}">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <main class="rfc-document">
        {{ content }}
    </main>
    <footer class="rfc-document">
        <p>Text licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
            Code licensed under <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache-2.0</a>.</p>
    </footer>
</body>

</html>
